<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="50%" style="stop-color:#e0e0e0"/>
      <stop offset="100%" style="stop-color:#999999"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bgGrad)"/>

  <!-- Subtle inner border -->
  <rect x="3" y="3" width="94" height="94" rx="19" ry="19" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- Single letter A as a real bold glyph — guarantees a visible crossbar
       at any favicon size, independent of stroke rendering. -->
  <text x="50" y="74"
        text-anchor="middle"
        font-family="Arial, Helvetica, 'Segoe UI', sans-serif"
        font-size="66"
        font-weight="800"
        fill="url(#textGrad)"
        filter="url(#glow)">A</text>

  <!-- Green dot accent -->
  <circle cx="84" cy="18" r="5" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.6;1" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle glow around dot -->
  <circle cx="84" cy="18" r="8" fill="none" stroke="#22c55e" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
